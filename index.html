<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>I ❤ HFC</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Anton&family=Permanent+Marker&family=Space+Mono:wght@400;700&display=swap');

  @font-face{
    font-family:'IzzyHand2';
    src:url('fonts/IzzyHand2.ttf') format('truetype');
    font-display:swap;
  }

  :root{
    --paper: #e9e4d6;
    --ink: #171512;
    --red: #c0242f;
    --tape: #eee7c9;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }
  html{ -webkit-text-size-adjust:100%; }
  body{
    background: var(--ink);
    color: var(--paper);
    font-family:'Space Mono', monospace;
    overflow-x:hidden;
  }

  /* ---------- shared black grid background ---------- */
  .grid{
    background-color:#000;
    background-image:
      linear-gradient(rgba(140,140,140,0.28) 1px, transparent 1px),
      linear-gradient(90deg, rgba(140,140,140,0.28) 1px, transparent 1px);
    background-size:48px 48px;
  }

  /* one scroll = one screen (mouse / trackpad) */
  @media (hover:hover) and (pointer:fine){
    html{ scroll-snap-type:y mandatory; }
    .hero, .toss, .info{ scroll-snap-align:start; }
  }

  /* ---------- 1: full-screen video ---------- */
  .hero{ position:relative; height:100vh; height:100svh; overflow:hidden; background:#000; }
  .hero video{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .cue{
    position:absolute; left:0; right:0; bottom:28px; text-align:center;
    font-size:11px; letter-spacing:0.28em; text-transform:uppercase; color:var(--paper);
    text-shadow:0 1px 8px rgba(0,0,0,0.7); pointer-events:none;
  }
  .cue span{ display:inline-block; animation: bob 1.6s ease-in-out infinite; }
  @keyframes bob{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(8px); } }

  /* ---------- 2: photos all land on one scroll ---------- */
  .toss{ position:relative; height:100vh; height:100svh; overflow:hidden; color:var(--paper); }
  .toss-title{
    position:absolute; left:0; right:0; top:50%; transform:translateY(-50%);
    text-align:center; padding:0 12px;
    font-family:'Anton', sans-serif; text-transform:uppercase;
    font-size:min(24vw, 250px); line-height:0.9; letter-spacing:0.01em;
    color:rgba(233,228,214,0.08);
  }
  .toss-title em{ font-style:normal; color:rgba(192,36,47,0.35); }
  .toss-marker{
    position:absolute; left:0; right:0; top:22px; text-align:center;
    font-family:'IzzyHand2', 'Permanent Marker', cursive; font-size:clamp(22px, 4.6vw, 36px); color:var(--red);
    transform:rotate(-2deg);
    text-transform:uppercase;
    z-index:50; pointer-events:none;
  }
  .shot{
    position:absolute; left:50%; top:50%;
    width:clamp(130px, 30vw, 250px);
    margin:calc(clamp(130px, 30vw, 250px) * -0.6) 0 0 calc(clamp(130px, 30vw, 250px) / -2);
    opacity:0;
    transition: transform 0.9s cubic-bezier(.2,.85,.25,1.15), opacity 0.4s ease;
    transition-delay: calc(var(--i) * 90ms);
  }
  .toss.in .shot{ opacity:1; }
  .shot .card{
    background:#fbf9f2; padding:9px 9px 34px;
    box-shadow:0 14px 30px rgba(0,0,0,0.3), 0 2px 4px rgba(0,0,0,0.2);
    position:relative;
    transition: transform 0.35s cubic-bezier(.2,.9,.3,1.4), box-shadow 0.35s ease;
    animation: drift 6s ease-in-out infinite;
    animation-delay: var(--d, 0s);
  }
  .shot:hover{ z-index:40 !important; }
  .shot:hover .card{ transform: scale(1.12) rotate(0deg); box-shadow:0 24px 44px rgba(0,0,0,0.4); animation-play-state:paused; }
  @keyframes drift{ 0%,100%{ transform: translateY(0) rotate(0deg); } 50%{ transform: translateY(-7px) rotate(1.2deg); } }
  .shot img{
    display:block; width:100%; aspect-ratio:4/5; object-fit:cover;
    filter: sepia(0.18) contrast(1.05) saturate(1.1);
  }
  .shot .tape{
    position:absolute; top:-12px; left:50%; width:64px; height:22px; margin-left:-32px;
    background:var(--tape); opacity:0.85; transform:rotate(-4deg);
    box-shadow:0 1px 2px rgba(0,0,0,0.15);
  }
  .toss-cue{
    z-index:50;
    position:absolute; left:0; right:0; bottom:26px; text-align:center;
    font-size:11px; letter-spacing:0.28em; text-transform:uppercase; color:#8a8672;
  }
  .toss-cue span{ display:inline-block; animation: bob 1.6s ease-in-out infinite; }

  /* ---------- 4: order ---------- */
  .info{
    color: var(--paper);
    padding: 64px 22px 72px;
    min-height:100vh; min-height:100svh;
    display:flex; align-items:center;
  }
  .stub{
    max-width:460px; width:100%; margin:0 auto; padding:30px 26px 32px;
    background:#161616; border:1px solid #444;
    box-shadow:0 0 0 6px rgba(0,0,0,0.6), 0 24px 60px rgba(0,0,0,0.8);
  }
  .stub h2{
    font-family:'Anton', sans-serif; text-transform:uppercase;
    font-size:25px; letter-spacing:0.01em; margin-bottom:4px;
  }
  .stub .sub{
    font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:#94907d;
    margin-bottom:28px;
  }

  .row{
    display:flex; justify-content:space-between; align-items:baseline;
    padding:13px 0; border-bottom:1px solid #2c2a24; font-size:13.5px;
  }
  .row span:first-child{ text-transform:uppercase; font-size:10.5px; letter-spacing:0.12em; color:#8a8672; }
  .row span:last-child{ font-weight:600; letter-spacing:0.01em; }
  .row.price span:last-child{ color:var(--red); font-weight:700; font-size:15px; }

  .field{ margin-top:18px; }
  .field label{
    display:block; font-size:10.5px; letter-spacing:0.14em; text-transform:uppercase;
    color:#8a8672; margin-bottom:7px;
  }
  .field input{
    width:100%; background:transparent; border:1px solid #4a463c; color:var(--paper);
    font-family:'Space Mono', monospace; font-size:16px; padding:12px; outline:none; border-radius:0;
    transition:border-color 0.15s ease;
  }
  .field input:focus{ border-color:var(--red); }
  .field input::placeholder{ color:#6b6758; }

  .shirt{
    margin-top:26px; padding:18px 16px 20px;
    border:1px solid #2c2a24; background:rgba(255,255,255,0.025);
    animation: fadeUp 0.4s ease-out;
  }
  .shirt-head{ display:flex; justify-content:space-between; align-items:center; }
  .shirt-head .title{ font-family:'Anton', sans-serif; text-transform:uppercase; font-size:17px; letter-spacing:0.04em; }
  .remove{
    background:none; border:none; color:#8a8672; font-family:'Space Mono', monospace;
    font-size:11px; letter-spacing:0.12em; text-transform:uppercase; cursor:pointer; padding:4px 0;
  }
  .remove:hover{ color:var(--red); }
  .shirt .sub{ margin:20px 0 0; }

  .sizes{ display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
  .size-btn{
    border:1px solid #4a463c; background:transparent; color:var(--paper);
    font-family:'Space Mono', monospace; font-weight:700; font-size:12px;
    width:44px; padding:11px 0; cursor:pointer; border-radius:0;
    transition:border-color 0.15s ease, background 0.15s ease, color 0.15s ease;
  }
  .size-btn:hover{ border-color:var(--paper); }
  .size-btn.active{ background:var(--red); color:var(--paper); border-color:var(--red); }
  .style-btn{ width:auto; padding:11px 14px; }
  .shirt.invalid{ border-color:var(--red); }

  .add{
    display:block; width:100%; margin-top:16px; padding:14px 0;
    background:transparent; color:var(--paper); border:1px dashed #6b6758;
    font-family:'Space Mono', monospace; font-weight:700; font-size:12px;
    letter-spacing:0.14em; text-transform:uppercase; cursor:pointer; border-radius:0;
    transition:border-color 0.15s ease, color 0.15s ease;
  }
  .add:hover{ border-color:var(--red); color:var(--red); }

  .total{ display:flex; justify-content:space-between; align-items:baseline; margin-top:24px; padding-top:14px; border-top:1px solid #4a463c; }
  .total span:first-child{ text-transform:uppercase; font-size:10.5px; letter-spacing:0.12em; color:#8a8672; }
  .total span:last-child{ font-family:'Anton', sans-serif; font-size:26px; color:var(--red); }

  .error{ min-height:18px; margin-top:16px; font-size:12px; color:#ff6b73; line-height:1.5; }
  .cta{
    display:block; width:100%; margin-top:6px; background:var(--red); color:var(--paper); border:none;
    text-align:center; font-family:'Space Mono', monospace; font-weight:700; font-size:12.5px;
    letter-spacing:0.14em; text-transform:uppercase; padding:17px 0; cursor:pointer; border-radius:0;
    transition:opacity 0.15s ease;
  }
  .cta:hover{ opacity:0.9; }
  .cta:disabled{ opacity:0.5; cursor:default; }
  .note{ margin-top:16px; font-size:10.5px; text-align:center; color:#8a8672; line-height:1.6; }

  .thank-you{ text-align:center; padding:30px 0 10px; animation: fadeUp 0.5s ease-out; }
  .thank-you-heart{ font-size:52px; color:var(--red); line-height:1; margin-bottom:14px; animation: heartPop 0.6s ease-out; }
  .thank-you h2{ margin-bottom:10px; }
  .thank-you .sub{ margin-bottom:0; color:var(--paper); opacity:0.75; }
  .thank-you ul{ list-style:none; margin:22px 0 0; font-size:13px; line-height:2; color:var(--paper); }
  .thank-you .sum{ margin-top:14px; font-family:'Anton', sans-serif; font-size:22px; color:var(--red); }

  @keyframes fadeUp{ 0%{ opacity:0; transform:translateY(14px); } 100%{ opacity:1; transform:translateY(0); } }
  @keyframes heartPop{ 0%{ transform:scale(0.4); opacity:0; } 60%{ transform:scale(1.15); opacity:1; } 100%{ transform:scale(1); } }

  .heart-overlay{ position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:999; }
  .burst-heart{
    position:absolute; bottom:-5%; color:var(--red); line-height:1;
    animation: heartBurst 2.2s ease-out forwards;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
  }
  @keyframes heartBurst{
    0%{   opacity:0; transform: translateY(0) scale(0.2) rotate(var(--rot,0deg)); }
    12%{  opacity:1; transform: translateY(-12vh) scale(1.3) rotate(var(--rot,0deg)); }
    22%{  transform: translateY(-20vh) scale(1) rotate(var(--rot,0deg)); }
    78%{  opacity:1; transform: translateY(var(--rise,-90vh)) scale(1) rotate(var(--rot,0deg)); }
    100%{ opacity:0; transform: translateY(calc(var(--rise,-90vh) - 30px)) scale(1.6) rotate(var(--rot,0deg)); }
  }

  footer{
    text-align:center; padding:26px; font-size:10px; letter-spacing:0.14em; text-transform:uppercase;
    color:#8a8672; background:var(--ink); border-top:1px solid #2c2a24;
  }

  /* Reduced motion: photos become a plain wrap grid */
  @media (prefers-reduced-motion: reduce){
    .toss{ height:auto; padding:70px 16px; }
    .toss-title, .toss-cue{ display:none; }
    .toss-marker{ position:static; margin-bottom:24px; }
    .toss .shot{ position:relative; left:auto; top:auto; margin:0 14px 28px; display:inline-block; opacity:1; transform:none !important; transition:none; }
    .toss{ text-align:center; }
    .shot .card, .cue span, .toss-cue span{ animation:none; }
  }
</style>
</head>
<body>

<div class="heart-overlay" id="heartOverlay"></div>

<!-- 1: full-screen video -->
<section class="hero" id="hero">
  <video autoplay muted loop playsinline preload="auto" poster="hfc-poster.jpg">
    <source src="hfc.mp4" type="video/mp4">
  </video>
  <div class="cue"><span>scroll to enter ↓</span></div>
</section>

<!-- 2: the photos all land at once -->
<section class="toss grid" id="toss">
  <div class="toss-marker">designed by hammers, for hammers</div>
  <div class="toss-title">I <em>❤</em><br>HFC</div>
  <div class="shot" style="--i:0"><div class="card" style="--d:0s"><img src="photos/photo1.jpg" alt=""><div class="tape"></div></div></div>
  <div class="shot" style="--i:1"><div class="card" style="--d:-1s"><img src="photos/photo2.jpg" alt=""><div class="tape"></div></div></div>
  <div class="shot" style="--i:2"><div class="card" style="--d:-2s"><img src="photos/photo3.jpg" alt=""><div class="tape"></div></div></div>
  <div class="shot" style="--i:3"><div class="card" style="--d:-3s"><img src="photos/photo4.jpg" alt=""><div class="tape"></div></div></div>
  <div class="shot" style="--i:4"><div class="card" style="--d:-4s"><img src="photos/photo5.jpg" alt=""><div class="tape"></div></div></div>
  <div class="shot" style="--i:5"><div class="card" style="--d:-5s"><img src="photos/photo6.jpg" alt=""><div class="tape"></div></div></div>
  <div class="shot" style="--i:6"><div class="card" style="--d:-2.5s"><img src="photos/photo7.jpg" alt=""><div class="tape"></div></div></div>
  <div class="toss-cue"><span>scroll to order ↓</span></div>
</section>

<!-- 4: order -->
<section class="info grid" id="order">
  <div class="stub">
    <form id="formState" novalidate>
      <h2>I need one</h2>
      <div class="sub">I ❤ Hammersmith FC — Tee</div>

      <div class="row price"><span>Price per shirt</span><span>£15</span></div>

      <div class="field">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" autocomplete="name" required>
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="email" required>
      </div>

      <div id="shirts"></div>

      <button type="button" class="add" id="addShirt">+ Add another shirt</button>

      <div class="total"><span id="totalLabel">1 shirt</span><span id="totalPrice">£15</span></div>

      <div class="error" id="error" role="alert"></div>
      <button type="submit" class="cta" id="submitBtn">Register interest</button>
      <div class="note">All profits are going to HFC ❤</div>
    </form>

    <div id="thankYouState" class="thank-you" hidden>
      <div class="thank-you-heart">❤</div>
      <h2>I ❤ HFC</h2>
      <div class="sub">You're on the list!</div>
      <ul id="summaryList"></ul>
      <div class="sum" id="summaryTotal"></div>
    </div>
  </div>
</section>

<footer>Limited Edition — Friends and Family</footer>

<template id="shirtTpl">
  <div class="shirt">
    <div class="shirt-head">
      <div class="title">Shirt <span class="num">1</span></div>
      <button type="button" class="remove" hidden>Remove</button>
    </div>
    <div class="sub">Select size</div>
    <div class="sizes" data-group="size">
      <button class="size-btn" type="button">S</button>
      <button class="size-btn" type="button">M</button>
      <button class="size-btn" type="button">L</button>
      <button class="size-btn" type="button">XL</button>
      <button class="size-btn" type="button">XXL</button>
    </div>
    <div class="sub">Select style</div>
    <div class="sizes" data-group="style">
      <button class="size-btn style-btn" type="button">Classic T</button>
      <button class="size-btn style-btn" type="button">Cropped w Rolled Hem</button>
    </div>
  </div>
</template>

<script>
  /* ================= photos: all fly in on one scroll ================= */
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const toss = document.getElementById('toss');
  const shots = Array.from(document.querySelectorAll('.shot'));

  // final spot (fraction of screen from centre) + rotation for each photo
  const landing = [
    [-0.27, -0.20, -8], [0.06, -0.27, 5], [0.29, -0.10, 9], [-0.22, 0.17, 6],
    [0.09, 0.13, -5], [0.31, 0.24, -10], [-0.03, -0.03, 3]
  ];

  function place(landed){
    const W = window.innerWidth, H = window.innerHeight;
    const spread = W < 700 ? 1.5 : 1;
    shots.forEach((s, i) => {
      const [lx, ly, lr] = landing[i];
      if(landed){
        s.style.transform = 'translate(' + lx * W * spread + 'px,' + (0.04 + ly * 0.85) * H + 'px) rotate(' + lr + 'deg)';
      } else {
        const a = (i / shots.length) * Math.PI * 2 + 0.6;
        s.style.transform = 'translate(' + Math.cos(a) * W + 'px,' + Math.sin(a) * H + 'px) rotate(' + (a * 90 + 160) + 'deg) scale(0.5)';
      }
      s.style.zIndex = i + 1;
    });
  }

  if(!reduced){
    place(false);
    window.addEventListener('resize', () => place(toss.classList.contains('in')));
    new IntersectionObserver(entries => {
      entries.forEach(en => {
        const on = en.isIntersecting;
        toss.classList.toggle('in', on);
        place(on);
      });
    }, { threshold: 0.55 }).observe(toss);
  }

  // some browsers block autoplay until a gesture; retry on first touch/scroll
  const vid = document.querySelector('.hero video');
  const kick = () => { vid.play().catch(()=>{}); };
  window.addEventListener('scroll', kick, { once: true, passive: true });
  window.addEventListener('touchstart', kick, { once: true, passive: true });

  /* ================= order form ================= */
  const PRICE = 15;
  const SHEET_ENDPOINT = 'https://script.google.com/macros/s/AKfycbyOnGeW2u7KTnbvDB-rk_6uzFA2KMrNPxY9fiOLDQQZHfAgPUBRwgxhq0zXtJpmaFK-/exec';

  const shirtsEl = document.getElementById('shirts');
  const tpl = document.getElementById('shirtTpl');
  const errorEl = document.getElementById('error');

  function addShirt(){
    const node = tpl.content.firstElementChild.cloneNode(true);
    node.dataset.size = '';
    node.dataset.style = '';
    node.querySelectorAll('.sizes').forEach(group => {
      const key = group.dataset.group;
      group.addEventListener('click', e => {
        const btn = e.target.closest('.size-btn');
        if(!btn) return;
        group.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        node.dataset[key] = btn.textContent.trim();
        node.classList.remove('invalid');
      });
    });
    node.querySelector('.remove').addEventListener('click', () => {
      node.remove();
      refresh();
    });
    shirtsEl.appendChild(node);
    refresh();
    return node;
  }

  function refresh(){
    const cards = shirtsEl.querySelectorAll('.shirt');
    cards.forEach((c, i) => {
      c.querySelector('.num').textContent = i + 1;
      c.querySelector('.remove').hidden = cards.length === 1;
    });
    const n = cards.length;
    document.getElementById('totalLabel').textContent = n + (n === 1 ? ' shirt' : ' shirts') + (n > 1 ? ' × £' + PRICE : '');
    document.getElementById('totalPrice').textContent = '£' + (n * PRICE);
  }

  document.getElementById('addShirt').addEventListener('click', () => {
    const c = addShirt();
    c.scrollIntoView({ behavior: reduced ? 'auto' : 'smooth', block: 'center' });
  });
  addShirt();

  document.getElementById('formState').addEventListener('submit', async e => {
    e.preventDefault();
    const name = document.getElementById('name').value.trim();
    const email = document.getElementById('email').value.trim();
    const cards = Array.from(shirtsEl.querySelectorAll('.shirt'));

    errorEl.textContent = '';
    cards.forEach(c => c.classList.remove('invalid'));

    if(!name){ errorEl.textContent = 'Please add your name.'; document.getElementById('name').focus(); return; }
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ errorEl.textContent = 'Please add a valid email.'; document.getElementById('email').focus(); return; }
    const bad = cards.filter(c => !c.dataset.size || !c.dataset.style);
    if(bad.length){
      bad.forEach(c => c.classList.add('invalid'));
      errorEl.textContent = 'Pick a size and style for ' + (bad.length === 1 ? 'the highlighted shirt.' : 'each highlighted shirt.');
      bad[0].scrollIntoView({ behavior: reduced ? 'auto' : 'smooth', block: 'center' });
      return;
    }

    const shirts = cards.map(c => ({ size: c.dataset.size, style: c.dataset.style }));
    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = 'Sending…';

    // one request per shirt -> one sheet row per shirt, same name + email
    let failed = 0;
    for(let i = 0; i < shirts.length; i++){
      try{
        await fetch(SHEET_ENDPOINT, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({
            name, email,
            size: shirts[i].size,
            style: shirts[i].style,
            shirtNumber: i + 1,
            totalShirts: shirts.length,
            price: PRICE
          })
        });
      }catch(err){
        failed++;
        console.error('Submission failed', err);
      }
    }

    if(failed === shirts.length){
      btn.disabled = false;
      btn.textContent = 'Register interest';
      errorEl.textContent = 'Something went wrong sending your order. Check your connection and try again.';
      return;
    }

    document.getElementById('summaryList').innerHTML = '';
    shirts.forEach((s, i) => {
      const li = document.createElement('li');
      li.textContent = 'Shirt ' + (i + 1) + ' — ' + s.style + ', ' + s.size;
      document.getElementById('summaryList').appendChild(li);
    });
    document.getElementById('summaryTotal').textContent = shirts.length + (shirts.length === 1 ? ' shirt' : ' shirts') + ' · £' + (shirts.length * PRICE);
    document.getElementById('formState').hidden = true;
    document.getElementById('thankYouState').hidden = false;
    burstHearts();
  });

  function burstHearts(){
    const overlay = document.getElementById('heartOverlay');
    for(let i = 0; i < 45; i++){
      const h = document.createElement('div');
      h.className = 'burst-heart';
      h.textContent = '❤';
      h.style.left = Math.random() * 100 + 'vw';
      h.style.fontSize = (16 + Math.random() * 26) + 'px';
      h.style.setProperty('--rot', ((Math.random() * 70) - 35) + 'deg');
      h.style.setProperty('--rise', -(70 + Math.random() * 30) + 'vh');
      h.style.animationDelay = Math.random() * 0.6 + 's';
      overlay.appendChild(h);
      setTimeout(() => h.remove(), 3000);
    }
  }
</script>

</body>
</html>
